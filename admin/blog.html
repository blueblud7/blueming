<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>blueming · 글 관리</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500;600&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f5f3;--paper:#fff;--ink:#151719;--muted:#72767d;--line:#dedfdf;--blue:#2454a6;--sans:Pretendard,sans-serif;--serif:'Noto Serif KR',serif;--mono:'IBM Plex Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center}.login-box{background:var(--paper);border:1px solid var(--line);padding:42px;width:min(380px,calc(100% - 32px)}h1{font:500 30px var(--serif);margin:0 0 8px}.login p{color:var(--muted);font-size:14px;margin:0 0 25px}.login input,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;outline:0;border-radius:3px}.login input:focus,.field input:focus,.field textarea:focus{border-color:var(--blue)}.primary{background:var(--ink);color:#fff;border:0;padding:11px 16px;font-weight:600;border-radius:3px}.login button{width:100%;margin-top:10px}.error{color:#c33;font-size:13px;margin-top:10px}.app{display:grid;grid-template-columns:295px 1fr;min-height:100vh}.side{background:#1b1d20;color:#fff;padding:28px 18px}.side-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px 22px;border-bottom:1px solid #444}.side h2{font:500 22px var(--serif);margin:0}.side a{font:11px var(--mono);color:#bbb;text-decoration:none}.new{width:100%;margin:20px 0;background:#fff;color:#151719;border:0;padding:11px;font-weight:700;border-radius:3px}.post-item{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;border-top:1px solid #36383d;padding:14px 8px}.post-item.active{background:#303338}.post-item b{display:block;font-size:14px;line-height:1.45;margin-bottom:6px}.post-item span{font:10px var(--mono);color:#b6bbc4}.draft{color:#edca7c!important}.editor{max-width:1000px;width:100%;padding:38px 48px 100px;margin:auto}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.toolbar h1{font-size:26px}.toolbar .actions{display:flex;gap:8px}.ghost{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:3px}.danger{border:1px solid #df9a9a;background:#fff;color:#b52a2a;padding:10px 13px;border-radius:3px}.fields{display:grid;grid-template-columns:1fr 160px 140px;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font:10px var(--mono);color:var(--muted);letter-spacing:.06em}.field.title{grid-column:1/-1}.field.title input{font:500 30px var(--serif);letter-spacing:-1px}.field.excerpt{grid-column:1/-1}.field textarea{resize:vertical;line-height:1.7}.writing{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:25px}.writing textarea{min-height:500px}.preview{min-height:500px;background:var(--paper);border:1px solid var(--line);padding:30px;font:16px/2 var(--serif);white-space:pre-wrap;word-break:keep-all}.preview h2{font-size:22px;margin:30px 0 12px}.hint{font:11px var(--mono);color:var(--muted);margin:8px 0 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 17px;border-radius:3px;font-size:13px;display:none}.toast.show{display:block}@media(max-width:800px){.app{display:block}.side{min-height:auto}.editor{padding:28px 20px}.fields,.writing{grid-template-columns:1fr}.field.title input{font-size:25px}.writing textarea,.preview{min-height:360px}}
</style></head><body>
<section class="login" id="login"><div class="login-box"><h1>blueming</h1><p>글 관리 비밀번호를 입력하세요.</p><input id="password" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')signIn()"><button class="primary" onclick="signIn()">들어가기</button><div class="error" id="error"></div></div></section>
<section class="app" id="app" hidden><aside class="side"><div class="side-head"><h2>글 관리</h2><a href="/">사이트 보기 ↗</a></div><button class="new" onclick="newPost()">+ 새 글</button><div id="post-list"></div></aside><main class="editor"><div class="toolbar"><h1 id="editor-label">새 글</h1><div class="actions"><button class="danger" onclick="removePost()">삭제</button><button class="ghost" onclick="save('draft')">임시저장</button><button class="primary" onclick="save('published')">발행하기</button></div></div><div class="fields"><div class="field title"><label>제목</label><input id="title" placeholder="글 제목"></div><div class="field excerpt"><label>요약</label><textarea id="excerpt" rows="2" placeholder="글 목록에 표시할 한두 문장"></textarea></div><div class="field"><label>카테고리</label><input id="category" value="NOTE"></div><div class="field"><label>발행일</label><input id="date" type="date"></div><div class="field"><label>상태</label><select id="status"><option value="draft">임시저장</option><option value="published">발행됨</option></select></div></div><div class="writing"><div class="field"><label>본문 · Markdown</label><textarea id="body" placeholder="# 소제목\n\n본문을 작성하세요." oninput="renderPreview()"></textarea><p class="hint">빈 줄은 문단 구분, #은 소제목, **굵게**를 지원합니다.</p></div><div class="field"><label>미리보기</label><article class="preview" id="preview"></article></div></div></main></section><div class="toast" id="toast"></div>
<script>
let password='',posts=[],current=null;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function markdown(text){return esc(text).split(/\n\n+/).map(p=>p.startsWith('# ')?`<h2>${p.slice(2)}</h2>`:`<p>${p.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>)}</p>`).join('')}
async function signIn(){password=$('password').value;const r=await fetch('/api/posts?admin=1',{headers:{'x-admin-password':password}});if(!r.ok){$('error').textContent='비밀번호가 맞지 않습니다.';return}posts=(await r.json()).posts||[];$('login').hidden=true;$('app').hidden=false;renderList();if(posts[0])openPost(posts[0].id);else newPost()}
function renderList(){$('post-list').innerHTML=posts.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>`<button class="post-item ${p.id===current?'active':''}" onclick="openPost('${p.id}')"><b>${esc(p.title||'제목 없는 글')}</b><span class="${p.status==='draft'?'draft':''}">${p.status==='published'?'PUBLISHED':'DRAFT'} · ${p.date||'날짜 없음'}</span></button>`).join('')}
function readForm(){return{id:current||String(Date.now()),title:$('title').value.trim(),excerpt:$('excerpt').value.trim(),category:$('category').value.trim()||'NOTE',date:$('date').value,status:$('status').value,body:$('body').value}}
function openPost(id){const p=posts.find(p=>p.id===id);if(!p)return;current=id;$('editor-label').textContent='글 편집';['title','excerpt','category','date','status','body'].forEach(k=>$(k).value=p[k]||'');renderPreview();renderList()}
function newPost(){current=null;$('editor-label').textContent='새 글';$('title').value='';$('excerpt').value='';$('category').value='NOTE';$('date').value=new Date().toISOString().slice(0,10);$('status').value='draft';$('body').value='';renderPreview();renderList()}
function renderPreview(){$('preview').innerHTML=markdown($('body').value)||'<span style="color:#72767d;font-family:Pretendard,sans-serif">본문 미리보기</span>'}
async function save(status){const p=readForm();if(!p.title||!p.body){toast('제목과 본문을 작성하세요.');return}p.status=status;$('status').value=status;const i=posts.findIndex(x=>x.id===p.id);if(i<0)posts.push(p);else posts[i]=p;const r=await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({posts})});if(!r.ok){toast('저장하지 못했습니다.');return}current=p.id;renderList();toast(status==='published'?'발행했습니다.':'임시저장했습니다.')}
async function removePost(){if(!current||!confirm('이 글을 삭제할까요?'))return;posts=posts.filter(p=>p.id!==current);const r=await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({posts})});if(!r.ok){toast('삭제하지 못했습니다.');return}newPost();toast('삭제했습니다.')}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
</script></body></html>
