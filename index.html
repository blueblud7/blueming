500 23px/1.4 var(--serif);letter-spacing:-1px;margin:0 0 8px;transition:.18s}.entry p{font-size:14px}.sidebar{padding-top:35px}.side-block{border-top:2px solid var(--ink);padding:13px 0 24px;margin-bottom:32px}.side-block h3{margin:0 0 14px;font:500 11px var(--mono);letter-spacing:.08em}.about{font-size:14px;line-height:1.8;color:var(--muted)}.topics{display:flex;flex-wrap:wrap;gap:7px}.topics span{border:1px solid var(--line);padding:6px 8px;font:11px var(--mono);color:#4d535c}.mini{display:block;border-top:1px solid var(--line);padding:12px 0;text-decoration:none;font-size:13px;line-height:1.55}.mini:hover{color:var(--blue)}.mini em{display:block;font:10px var(--mono);color:var(--muted);font-style:normal;margin-bottom:3px}.project-links{border-top:1px solid var(--line);padding:26px 0 48px}.project-links h2{font:500 11px var(--mono);letter-spacing:.08em;margin:0 0 14px}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.project{border:1px solid var(--line);padding:16px;text-decoration:none;background:var(--paper);min-height:90px}.project:hover{border-color:var(--blue);color:var(--blue)}.project b{display:block;font-size:14px;margin-bottom:6px}.project span{font:11px var(--mono);color:var(--muted)}.foot{border-top:1px solid var(--line);padding:23px 0 42px;display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted)}.post-view{max-width:760px;margin:0 auto;padding:54px 0 110px}.post-view[hidden],.home[hidden]{display:none}.back{font:11px var(--mono);color:var(--muted);text-decoration:none}.back:hover{color:var(--blue)}.post-header{border-bottom:1px solid var(--line);padding:60px 0 35px;margin-bottom:38px}.post-header .type{font:11px var(--mono);color:var(--blue)}.post-header h1{font:500 clamp(34px,5vw,56px)/1.28 var(--serif);letter-spacing:-2.4px;margin:18px 0}.post-header p{font-size:16px;line-height:1.75;color:var(--muted);margin:0}.post-body{font:17px/2.05 var(--serif);letter-spacing:-.25px;word-break:keep-all}.post-body     <div class="feed"><main class="main-feed"><div id="featured"></div><div class="entries" id="entries"></div></main><aside class="sidebar"><section class="side-block"><h3>ABOUT</h3><p class="about">blueming은 일을 하며 마주한 생각과, 기술이 삶을 바꾸는 방식에 대해 씁니다.</p></section><section class="side-block"><h3>TOPICS</h3><div class="topics"><span>WORK</span><span>THINKING</span><span>TECH</span><span>READING</span></div></section><section class="side-block"><h3>RECENT</h3><div id="recent"></div></section></aside></div>

  <script>
    const posts=[
      {type:'GUIDE',date:'2026.08.06',title:'blueming 서비스 가이드 — 기록과 프로젝트 생태계 안내',lead:'blueming 플랫폼의 목적과 주요 기능, 그리고 K-Stock, 증권 리포트, PlotBranch 등 연동된 프로젝트 서비스 활용 가이드입니다.',body:['blueming에 오신 것을 환영합니다! **blueming**은 기술, 일과 삶에 대한 에세이 및 메모를 기록하고, 독립적으로 운영되는 다양한 웹 서브 프로젝트들을 한곳에서 연결하여 제공하는 디지털 퍼블리싱 플랫폼입니다.','검색 엔진(SEO)을 통해 방문하신 분들이나 처음 오신 분들이 blueming과 연결된 다양한 서비스들을 효율적으로 탐색하실 수 있도록, 주요 메뉴와 연동 프로젝트 활용법을 안내해 드립니다.','blueming 메인 화면은 최신 아티클 피드와 함께 하단에 실시간 연동 프로젝트 카드로 구성되어 있으며, [K-Stock 증시 데이터](https://myportfolio.blueming.net), [Daily Report 주식 리포트](https://reports.blueming.net), [RecruitMatch 채용 서비스](https://talentsync.blueming.net), [PlotBranch 플롯 도구](https://plotbranch.blueming.net) 등을 손쉽게 이용할 수 있습니다.']},
      {type:'ESSAY',date:'2026.08.05',title:'일을 잘한다는 말의 조금 다른 뜻',lead:'성과와 속도, 그리고 여백 사이에서 오래 일하며 깨달은 일의 진짜 가치와 방향성.',body:['일을 잘한다는 말은 대개 속도와 정확함을 가리킨다. 주어진 마감 기한 내에 오차 없이 과업을 완수하고, 기대치보다 조금 더 나아간 성과를 만드는 사람. 조직과 시장은 그런 사람을 믿을 만한 프로라고 부른다.','하지만 일의 연차가 쌓일수록, 좋은 결실은 단지 답을 빨리 내는 데서 시작되지 않는다는 것을 실감한다. 함께 일하는 동료들이 더 깊고 좋은 질문을 할 수 있도록 환경을 조성하는 일, 그리고 아직 아무도 정의하지 않은 숨은 문제를 발굴해내는 일이 훨씬 중요할 때가 많다.','## 속도와 효율 너머의 진짜 문제','질문은 때로 일의 진행을 잠시 멈추게 만든다. "지금 우리가 풀고 있는 문제가 정말 해결해야 하는 본질적인 문제인가?", "빠르게 만들어낸 이 결과가 사용자에게 진짜 가치를 전달하는가?"를 다시 묻게 만들기 때문이다. 효율성만 추구하는 시각에서는 질문이 비효율적인 지연처럼 보일 수 있다.','그러나 질문이 없는 속도는 쉽게 길을 잃는다. 훌륭한 산출물은 쌓이지만, 그 산출물들이 궁극적으로 어디를 향해 가는지 아무도 설명하지 못하는 상황이 발생한다. 속도는 결과를 빠르게 만들지만, 좋은 질문은 올바른 방향을 정립해 준다.','## 여백과 질문을 허용하는 리더십','결국 진정으로 일을 잘하는 사람은 스스로 달려나가는 속도뿐만 아니라, 전체 팀이 올바른 방향을 바라보고 지속 가능한 가치를 만들 수 있도록 중간중간 생각의 여백을 확보하는 사람이다. 나는 오늘도 속도와 질문 사이에서 더 튼튼한 균형점을 찾기 위해 노력한다.']},
      {type:'NOTE',date:'2026.07.24',title:'좋아하는 일을 오래 하기 위해',lead:'지속 가능한 성장을 위해 의지보다 먼저 설계해야 할 삶과 작업의 리듬.',body:['좋아하는 일이라고 해서 365일 언제나 즐거울 수는 없다. 일을 향한 애정과 열정만으로 피로와 번아웃을 완전히 막아낼 수 있는 것도 아니다. 창작이든 개발이든, 오랫동안 자신만의 작업을 이어가는 사람들은 순간의 의지나 순수한 열정보다 "지속 가능한 리듬"을 먼저 디자인한다.','## 열정보다 강력한 시스템과 루틴','몰입해서 폭발적으로 일하는 하루 뒤에는 반드시 비어 있는 휴식의 시간을 배치하고, 하루 만에 완벽한 결과물을 완성하려 애쓰기보다 다음 날 기쁜 마음으로 다시 돌아올 수 있는 여지를 남겨둔다. 지속한다는 것은 뜨거운 마음의 크기보다, 언제든 다시 돌아올 수 있는 건강한 시스템을 가꾸는 기술에 가깝다.','## 완벽주의를 내려놓는 용기','많은 사람들이 작업을 지속하지 못하는 이유 중 하나는 완벽주의 때문이다. 초안부터 완벽해야 한다는 부담감은 시작조차 어렵게 만들고, 조금이라도 기대에 미치지 못하면 쉽게 포기하게 만든다. 하지만 장기적인 관점에서는 80% 수준의 완성도를 지닌 작업물을 꾸준히 세상에 내놓고 피드백을 받으며 개선해 나가는 리듬이 훨씬 강력하다.']},
      {type:'WORKING NOTE',date:'2026.07.08',title:'AI와 함께 일할 때 남겨야 할 것',lead:'생성형 AI 시대, 도구가 더 빠르고 풍부한 초안을 만들어낼 때 인간에게 남겨지는 본질적인 역할과 판단의 가치.',body:['생성형 AI와 다양한 자동화 도구들이 날로 발전하면서 코딩, 글쓰기, 디자인 등 수많은 작업의 초안이 순식간에 만들어지는 시대를 살고 있다. 몇 초 만에 수십 줄의 코드나 완성도 높은 문장이 출력되는 모습을 보면 기술의 속도에 경탄하게 된다.','## 초안의 자동화와 인간의 역할','하지만 도구가 초안을 쉽게 생성해 줄수록, 인간 작업자에게 남겨지는 본질적인 역할은 바로 "판단과 선택"이다. 수많은 생성 결과물 중 무엇을 덜어내고 벼릴 것인가, 어떤 톤과 매너가 우리 브랜드와 서비스의 정체성에 부합하는가, 그리고 지금 이 기술적 해결책이 진정으로 해결하고자 하는 문제에 적합한가를 결정하는 것은 결국 인간의 몫이다.','## 선택의 이유가 만드는 고유성','AI는 아이디어의 출발점을 풍부하게 만들어 주고 작업의 물리적 시간을 대폭 줄여줄 수 있다. 그러나 최종 결과물에 생명력을 불어넣는 것은 "왜 이 방식을 선택했는가"에 대한 깊은 맥락과 이유다. 선택의 이유와 고민의 궤적이 쌓일 때 비로소 타인과 차별화되는 고유한 결과물이 만들어진다.']}
      {type:'LETTER',date:'2026.06.19',title:'작은 프로젝트를 공개하는 마음',lead:'완벽해질 때까지 기다리지 않기로 한 기록.',body:['작은 프로젝트를 세상에 내놓을 때는 늘 조금 부끄럽다. 아직 모자란 곳이 먼저 보이기 때문이다.','하지만 공개는 끝이 아니라 대화의 시작이다. 누군가의 작은 반응 하나가 다음 버전의 방향을 알려주기도 한다. 그래서 오늘도 덜 완벽한 것을 조심스럽게 꺼내놓는다.']}
    ];
    const link=(i,clazz='')=>`<a class="${clazz}" href="?post=${i}">`;
    document.getElementById('featured').innerHTML=link(0,'feature')+`<div class="stamp"><b>${posts[0].type}</b>${posts[0].date}<br>6 MIN READ</div><div><h2>${posts[0].title}</h2><p>${posts[0].lead}</p></div></a>`;
    document.getElementById('entries').innerHTML=posts.slice(1).map((p,i)=>link(i+1,'entry')+`<div class="stamp"><b>${p.type}</b>${p.date}</div><div><h2>${p.title}</h2><p>${p.lead}</p></div></a>`).join('');
    document.getElementById('recent').innerHTML=posts.slice(0,3).map((p,i)=>link(i,'mini')+`<em>${p.date}</em>${p.title}</a>`).join('');
    const params=new URLSearchParams(location.search),number=Number(params.get('post'));
    if(params.get('view')==='all'){document.getElementById('edition-title').textContent='모든 글';document.getElementById('edition-copy').textContent='시간순으로 쌓이는 모든 기록입니다.';document.getElementById('featured').hidden=true;document.getElementById('entries').innerHTML=posts.map((p,i)=>link(i,'entry')+`<div class="stamp"><b>${p.type}</b>${p.date}</div><div><h2>${p.title}</h2><p>${p.lead}</p></div></a>`).join('');}
    fetch('/api/projects',{cache:'no-store'}).then(r=>r.json()).then(data=>{const projects=(data.projects||[]).filter(p=>p.href);document.getElementById('project-grid').innerHTML=projects.length?projects.map(p=>`<a class="project" href="${p.href}" target="_blank" rel="noopener"><b>${p.title}</b><span>${p.en||p.tag||'PROJECT'} ↗</span></a>`).join(''):'<span class="stamp">연결된 프로젝트가 없습니다.</span>';}).catch(()=>{document.getElementById('project-grid').innerHTML='<span class="stamp">프로젝트를 불러오지 못했습니다.</span>';});
    if(params.has('post')&&Number.isInteger(number)&&posts[number]){const p=posts[number];document.getElementById('home').hidden=true;document.getElementById('post-view').hidden=false;document.getElementById('post-meta').textContent=`${p.type} · ${p.date}`;document.getElementById('post-title').textContent=p.title;document.getElementById('post-lead').textContent=p.lead;document.getElementById('post-body').innerHTML=p.body.map((v,i)=>i===2&&number===0?`<h2>속도보다 방향</h2><p>${v}</p>`:`<p>${v}</p>`).join('');document.title=`${p.title} — blueming`;}
    const escapeHtml=value=>String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const renderMarkdown=value=>escapeHtml(value).split(/\n\n+/).map(part=>{let html=part.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:underline;">$1 ↗</a>');return part.startsWith('## ')?`<h2>${html.slice(3)}</h2>`:`<p>${html}</p>`;}).join('');
    function renderRemote(remote){
      const item=p=>`<a class="entry" href="?post=${encodeURIComponent(p.id)}"><div class="stamp"><b>${escapeHtml(p.category)}</b>${escapeHtml(p.date)}</div><div><h2>${escapeHtml(p.title)}</h2><p>${escapeHtml(p.excerpt)}</p></div></a>`;
      const all=params.get('view')==='all', postId=params.get('post');
      if(postId){
        let p=remote.find(x=>String(x.id)===String(postId));
        if(!p&&Number.isInteger(Number(postId))&&remote[Number(postId)])p=remote[Number(postId)];
        if(p){
          document.getElementById('home').hidden=true;
          document.getElementById('post-view').hidden=false;
          document.getElementById('post-meta').textContent=`${escapeHtml(p.category)} · ${escapeHtml(p.date)}`;
          document.getElementById('post-title').textContent=p.title;
          document.getElementById('post-lead').textContent=p.excerpt||'';
          document.getElementById('post-body').innerHTML=renderMarkdown(p.body);
          document.title=`${p.title} — blueming`;
          return;
        }
      }
      document.getElementById('home').hidden=false;
      document.getElementById('post-view').hidden=true;
      document.getElementById('featured').hidden=all;
      if(all){
        document.getElementById('edition-title').textContent='모든 글';
        document.getElementById('edition-copy').textContent='시간순으로 쌓이는 모든 기록입니다.';
        document.getElementById('entries').innerHTML=remote.map(item).join('');
      }else{
        const [first,...rest]=remote;
        document.getElementById('featured').innerHTML=first?`<a class="feature" href="?post=${encodeURIComponent(first.id)}"><div class="stamp"><b>${escapeHtml(first.category)}</b>${escapeHtml(first.date)}</div><div><h2>${escapeHtml(first.title)}</h2><p>${escapeHtml(first.excerpt)}</p></div></a>`:'';
        document.getElementById('entries').innerHTML=rest.map(item).join('');
      }
      document.getElementById('recent').innerHTML=remote.slice(0,3).map(p=>`<a class="mini" href="?post=${encodeURIComponent(p.id)}"><em>${escapeHtml(p.date)}</em>${escapeHtml(p.title)}</a>`).join('');
    }
    fetch('/api/posts',{cache:'no-store'}).then(r=>r.json()).then(data=>{if(Array.isArray(data.posts)&&data.posts.length)renderRemote(data.posts)}).catch(()=>{});
  </script>
</body>
</html>
