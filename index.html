<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="blueming — 일과 생각, 기술에 대한 기록.">
  <meta property="og:title" content="blueming — 기록하는 사람의 블로그"><meta property="og:description" content="일과 생각, 기술에 대한 기록."><meta property="og:image" content="/og.png"><meta name="twitter:card" content="summary_large_image">
  <title>blueming — 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500;600&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#fbfbfa;--paper:#fff;--ink:#151719;--muted:#70747a;--line:#dedfdf;--blue:#2454a6;--wash:#f1f4f8;--sans:Pretendard,Arial,sans-serif;--serif:'Noto Serif KR',serif;--mono:'IBM Plex Mono',monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}a{color:inherit}.shell{max-width:1160px;margin:auto;padding:0 32px}.masthead{padding:26px 0 22px;border-bottom:2px solid var(--ink);display:flex;align-items:end;justify-content:space-between}.brand{font:600 30px var(--serif);letter-spacing:-1.5px;text-decoration:none}.brand span{color:var(--blue)}.tagline{font:12px var(--mono);color:var(--muted)}.nav{display:flex;gap:20px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.nav a{text-decoration:none}.nav a:hover{color:var(--blue)}.edition{padding:42px 0 27px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end}.edition h1{margin:0;font:500 clamp(36px,5vw,58px)/1.18 var(--serif);letter-spacing:-2.8px}.edition p{max-width:300px;margin:0;color:var(--muted);font-size:14px;line-height:1.7}.feed{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:62px;padding:0 0 70px}.main-feed{min-width:0}.feature{display:grid;grid-template-columns:160px 1fr;gap:28px;padding:35px 0;border-bottom:1px solid var(--line);text-decoration:none}.feature:hover h2,.entry:hover h2{color:var(--blue)}.stamp{font:11px/1.7 var(--mono);color:var(--muted);padding-top:6px}.stamp b{display:block;font-weight:500;color:var(--blue)}.feature h2{font:500 clamp(27px,3.6vw,42px)/1.28 var(--serif);letter-spacing:-1.8px;margin:0 0 14px;transition:.18s}.feature p,.entry p{margin:0;color:var(--muted);font-size:15px;line-height:1.8;word-break:keep-all}.entries{border-bottom:1px solid var(--line)}.entry{display:grid;grid-template-columns:160px 1fr;gap:28px;padding:27px 0;border-top:1px solid var(--line);text-decoration:none}.entry h2{font:500 23px/1.4 var(--serif);letter-spacing:-1px;margin:0 0 8px;transition:.18s}.entry p{font-size:14px}.sidebar{padding-top:35px}.side-block{border-top:2px solid var(--ink);padding:13px 0 24px;margin-bottom:32px}.side-block h3{margin:0 0 14px;font:500 11px var(--mono);letter-spacing:.08em}.about{font-size:14px;line-height:1.8;color:var(--muted)}.topics{display:flex;flex-wrap:wrap;gap:7px}.topics span{border:1px solid var(--line);padding:6px 8px;font:11px var(--mono);color:#4d535c}.mini{display:block;border-top:1px solid var(--line);padding:12px 0;text-decoration:none;font-size:13px;line-height:1.55}.mini:hover{color:var(--blue)}.mini em{display:block;font:10px var(--mono);color:var(--muted);font-style:normal;margin-bottom:3px}.project-links{border-top:1px solid var(--line);padding:26px 0 48px}.project-links h2{font:500 11px var(--mono);letter-spacing:.08em;margin:0 0 14px}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.project{border:1px solid var(--line);padding:16px;text-decoration:none;background:var(--paper);min-height:90px}.project:hover{border-color:var(--blue);color:var(--blue)}.project b{display:block;font-size:14px;margin-bottom:6px}.project span{font:11px var(--mono);color:var(--muted)}.foot{border-top:1px solid var(--line);padding:23px 0 42px;display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted)}.post-view{max-width:760px;margin:0 auto;padding:54px 0 110px}.post-view[hidden],.home[hidden]{display:none}.back{font:11px var(--mono);color:var(--muted);text-decoration:none}.back:hover{color:var(--blue)}.post-header{border-bottom:1px solid var(--line);padding:60px 0 35px;margin-bottom:38px}.post-header .type{font:11px var(--mono);color:var(--blue)}.post-header h1{font:500 clamp(34px,5vw,56px)/1.28 var(--serif);letter-spacing:-2.4px;margin:18px 0}.post-header p{font-size:16px;line-height:1.75;color:var(--muted);margin:0}.post-body{font:17px/2.05 var(--serif);letter-spacing:-.25px;word-break:keep-all}.post-body p{margin:0 0 28px}.post-body h2{font:600 24px var(--serif);letter-spacing:-1px;margin:54px 0 18px}.post-end{border-top:1px solid var(--line);margin-top:65px;padding-top:20px;font:11px var(--mono);color:var(--muted)}@media(max-width:760px){.shell{padding:0 20px}.masthead{align-items:start;flex-direction:column;gap:7px}.edition{display:block;padding:32px 0 22px}.edition p{margin-top:15px}.feed{display:block}.feature,.entry{grid-template-columns:1fr;gap:10px}.stamp{padding:0}.sidebar{display:none}.project-grid{grid-template-columns:1fr}.feature h2{font-size:31px}.post-view{padding-top:34px}.post-header{padding:46px 0 26px}.post-body{font-size:16px}.foot{flex-direction:column;gap:8px}}
  </style>
</head>
<body>
  <div class="shell home" id="home">
    <header class="masthead"><a href="/" class="brand">blue<span>ming</span></a><span class="tagline">WRITING / NOTES / 2026</span></header>
    <nav class="nav"><a href="/">최신 글</a><a href="?view=all">모든 글</a><a href="#projects">프로젝트</a><a href="mailto:hello@blueming.net">연락</a></nav>
    <section class="edition"><h1 id="edition-title">일과 생각을<br>기록합니다.</h1><p id="edition-copy">만드는 일, 읽는 일, 그리고 오래 남는 질문들에 대한 개인적인 메모.</p></section>
    <div class="feed"><main class="main-feed"><div id="featured"></div><div class="entries" id="entries"></div></main><aside class="sidebar"><section class="side-block"><h3>ABOUT</h3><p class="about">blueming은 일을 하며 마주한 생각과, 기술이 삶을 바꾸는 방식에 대해 씁니다.</p></section><section class="side-block"><h3>TOPICS</h3><div class="topics"><span>WORK</span><span>THINKING</span><span>TECH</span><span>READING</span></div></section><section class="side-block"><h3>RECENT</h3><div id="recent"></div></section></aside></div>
    <section class="project-links" id="projects"><h2>CONNECTED PROJECTS</h2><div class="project-grid" id="project-grid"><span class="stamp">프로젝트를 불러오는 중…</span></div></section>
    <footer class="foot"><span>© 2026 BLUEMING</span><span>SEOUL · KOREA</span></footer>
  </div>
  <main class="shell post-view" id="post-view" hidden><a class="back" href="?view=all">← 모든 글</a><header class="post-header"><div class="type" id="post-meta"></div><h1 id="post-title"></h1><p id="post-lead"></p></header><article class="post-body" id="post-body"></article><div class="post-end">— blueming</div></main>
  <script>
    const posts=[
      {type:'ESSAY',date:'2026.08.06',title:'일을 잘한다는 말의 조금 다른 뜻',lead:'성과와 여백 사이에서 오래 일하며 배운 몇 가지.',body:['일을 잘한다는 말은 대개 속도와 정확함을 가리킨다. 틀리지 않고, 늦지 않고, 기대보다 조금 더 멀리 가는 것. 우리는 그런 사람을 믿을 만한 동료라고 부른다.','하지만 시간이 지날수록 좋은 일은 답을 빨리 내는 데서 시작되지 않는다는 생각을 한다. 함께 일하는 사람들이 더 좋은 질문을 할 수 있게 만드는 일, 아직 이름 없는 문제를 발견해내는 일도 그만큼 중요하다.','질문은 종종 일을 잠시 멈추게 한다. 지금 풀고 있는 문제가 정말 풀어야 할 문제인지, 빠르게 만든 결과가 누군가에게 어떤 경험이 될지 다시 묻게 하기 때문이다. 그래서 질문은 때로 비효율처럼 보인다.','그러나 질문이 없는 속도는 방향을 잃기 쉽다. 결과는 쌓이지만, 그 결과들이 무엇을 향하는지는 아무도 설명하지 못하게 된다.','속도는 결과를 만든다. 하지만 질문은 방향을 만든다. 나는 요즘 그 둘 사이에 조금 더 넓은 자리를 남겨두려 한다.']},
      {type:'NOTE',date:'2026.07.24',title:'좋아하는 일을 오래 하기 위해',lead:'지속할 수 있는 리듬은 의지보다 먼저 설계되어야 한다.',body:['좋아하는 일도 매일 좋아할 수는 없다. 좋아한다는 이유만으로 지치지 않는 것은 아니다. 그래서 오래 하는 사람들은 의지보다 리듬을 먼저 만든다.','무리한 하루 뒤에는 비어 있는 하루를 두고, 완벽한 초안 대신 다음에 돌아올 수 있는 문장을 남긴다. 지속은 뜨거운 마음보다 돌아갈 자리를 만드는 기술에 가깝다.']},
      {type:'WORKING NOTE',date:'2026.07.08',title:'AI와 함께 일할 때 남겨야 할 것',lead:'더 빠르게 만들 수 있는 시대에, 나만의 판단을 지키는 법.',body:['도구가 초안을 써줄수록 사람에게 남는 일은 판단이다. 무엇을 덜어낼지, 어떤 문장이 우리다운지, 지금 이 문제를 풀어야 하는지.','AI는 생각의 출발점을 풍성하게 할 수 있다. 하지만 마지막에 남아야 하는 것은 선택의 이유다. 그 이유가 쌓여야 비로소 내 작업이 된다.']},
      {type:'LETTER',date:'2026.06.19',title:'작은 프로젝트를 공개하는 마음',lead:'완벽해질 때까지 기다리지 않기로 한 기록.',body:['작은 프로젝트를 세상에 내놓을 때는 늘 조금 부끄럽다. 아직 모자란 곳이 먼저 보이기 때문이다.','하지만 공개는 끝이 아니라 대화의 시작이다. 누군가의 작은 반응 하나가 다음 버전의 방향을 알려주기도 한다. 그래서 오늘도 덜 완벽한 것을 조심스럽게 꺼내놓는다.']}
    ];
    const link=(i,clazz='')=>`<a class="${clazz}" href="?post=${i}">`;
    document.getElementById('featured').innerHTML=link(0,'feature')+`<div class="stamp"><b>${posts[0].type}</b>${posts[0].date}<br>6 MIN READ</div><div><h2>${posts[0].title}</h2><p>${posts[0].lead}</p></div></a>`;
    document.getElementById('entries').innerHTML=posts.slice(1).map((p,i)=>link(i+1,'entry')+`<div class="stamp"><b>${p.type}</b>${p.date}</div><div><h2>${p.title}</h2><p>${p.lead}</p></div></a>`).join('');
    document.getElementById('recent').innerHTML=posts.slice(0,3).map((p,i)=>link(i,'mini')+`<em>${p.date}</em>${p.title}</a>`).join('');
    const params=new URLSearchParams(location.search),number=Number(params.get('post'));
    if(params.get('view')==='all'){document.getElementById('edition-title').textContent='모든 글';document.getElementById('edition-copy').textContent='시간순으로 쌓이는 모든 기록입니다.';document.getElementById('featured').hidden=true;document.getElementById('entries').innerHTML=posts.map((p,i)=>link(i,'entry')+`<div class="stamp"><b>${p.type}</b>${p.date}</div><div><h2>${p.title}</h2><p>${p.lead}</p></div></a>`).join('');}
    fetch('/api/projects',{cache:'no-store'}).then(r=>r.json()).then(data=>{const projects=(data.projects||[]).filter(p=>p.href);document.getElementById('project-grid').innerHTML=projects.length?projects.map(p=>`<a class="project" href="${p.href}" target="_blank" rel="noopener"><b>${p.title}</b><span>${p.en||p.tag||'PROJECT'} ↗</span></a>`).join(''):'<span class="stamp">연결된 프로젝트가 없습니다.</span>';}).catch(()=>{document.getElementById('project-grid').innerHTML='<span class="stamp">프로젝트를 불러오지 못했습니다.</span>';});
    if(params.has('post')&&Number.isInteger(number)&&posts[number]){const p=posts[number];document.getElementById('home').hidden=true;document.getElementById('post-view').hidden=false;document.getElementById('post-meta').textContent=`${p.type} · ${p.date}`;document.getElementById('post-title').textContent=p.title;document.getElementById('post-lead').textContent=p.lead;document.getElementById('post-body').innerHTML=p.body.map((v,i)=>i===2&&number===0?`<h2>속도보다 방향</h2><p>${v}</p>`:`<p>${v}</p>`).join('');document.title=`${p.title} — blueming`;}
    const escapeHtml=value=>String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const renderMarkdown=value=>escapeHtml(value).split(/\n\n+/).map(part=>part.startsWith('## ')?`<h2>${part.slice(3)}</h2>`:`<p>${part.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>)}</p>`).join('');
    function renderRemote(remote){
      const item=i=>`<a class="entry" href="?post=${encodeURIComponent(i.id)}"><div class="stamp"><b>${escapeHtml(i.category)}</b>${escapeHtml(i.date)}</div><div><h2>${escapeHtml(i.title)}</h2><p>${escapeHtml(i.excerpt)}</p></div></a>`;
      const all=params.get('view')==='all', postId=params.get('post');
      if(postId){const p=remote.find(x=>x.id===postId);if(!p)return;document.getElementById('home').hidden=true;document.getElementById('post-view').hidden=false;document.getElementById('post-meta').textContent=`${p.category} · ${p.date}`;document.getElementById('post-title').textContent=p.title;document.getElementById('post-lead').textContent=p.excerpt;document.getElementById('post-body').innerHTML=renderMarkdown(p.body);document.title=`${p.title} — blueming`;return;}
      document.getElementById('featured').hidden=all;if(all){document.getElementById('edition-title').textContent='모든 글';document.getElementById('edition-copy').textContent='시간순으로 쌓이는 모든 기록입니다.';document.getElementById('entries').innerHTML=remote.map(item).join('');}else{const [first,...rest]=remote;document.getElementById('featured').innerHTML=first?`<a class="feature" href="?post=${encodeURIComponent(first.id)}"><div class="stamp"><b>${escapeHtml(first.category)}</b>${escapeHtml(first.date)}</div><div><h2>${escapeHtml(first.title)}</h2><p>${escapeHtml(first.excerpt)}</p></div></a>`:'';document.getElementById('entries').innerHTML=rest.map(item).join('');}document.getElementById('recent').innerHTML=remote.slice(0,3).map(p=>`<a class="mini" href="?post=${encodeURIComponent(p.id)}"><em>${escapeHtml(p.date)}</em>${escapeHtml(p.title)}</a>`).join('');
    }
    fetch('/api/posts',{cache:'no-store'}).then(r=>r.json()).then(data=>{if(Array.isArray(data.posts)&&data.posts.length)renderRemote(data.posts)}).catch(()=>{});
  </script>
</body>
</html>
